<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">

    <link crossorigin="anonymous" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" rel="stylesheet">
    <link crossorigin="anonymous" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
          integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
          referrerpolicy="no-referrer" rel="stylesheet">

    <title th:text="${title}">Title</title>
</head>

<body>
<div class="container">
    <div class="row">
        <div class="col-12 my-5 d-flex justify-content-center align-items-center">
            <span class="h1">Post</span>
        </div>

        <div class="col-12">
            <div class="card">
                <div class="card-body">
                    <ul class="list-group list-group-flush">
                        <li class="list-group-item">
                            <strong>Id:</strong> <span th:text="${post.id}"></span>
                        </li>
                        <li class="list-group-item">
                            <strong>Title:</strong> <span th:text="${post.title}"></span>
                        </li>
                        <li class="list-group-item">
                            <strong>Body:</strong> <span th:text="${post.body}"></span>
                        </li>
                        <li class="list-group-item">
                            <strong>Publish Date:</strong> <span th:text="${post.publishDate}"></span>
                        </li>
                        <li class="list-group-item">
                            <strong>Author:</strong>
                            <a th:if="${post.author != null}"
                               th:href="@{/authors/{id}(id=${post.author.id})}"
                               th:text="${post.author.name} + ' ' + ${post.author.surname}"></a>
                            <span th:if="${post.author == null}">-</span>
                        </li>
                    </ul>
                </div>
            </div>

            <div class="my-3 d-flex gap-2">
                <a class="btn btn-primary" th:href="@{/posts}">
                    <i class="fa-solid fa-arrow-left"></i> Back
                </a>
                <a class="btn btn-warning" th:href="@{/posts/{id}/edit(id=${post.id})}">
                    <i class="fa-solid fa-pen"></i> Edit
                </a>
                <form method="post" th:action="@{/posts/{id}/delete(id=${post.id})}">
                    <button class="btn btn-danger" type="submit">
                        <i class="fa-solid fa-trash"></i> Delete
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>

<div class="container">
    <div class="row">
        <div class="col-12">
            <h2 class="text-center">Commenti</h2>
            <a class="btn btn-primary m-2" th:href="@{/comments/create}">
                <i class="fa-solid fa-plus"></i>
            </a>
        </div>
    </div>

    <div class="row">
        <div class="col-12">
            <table class="table table-striped table-responsive-lg">
                <thead>
                <tr>
                    <th>Id</th>
                    <th>Email</th>
                    <th>Body</th>
                    <th>Date</th>
                    <th>Actions</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="comment:${comments}">
                    <td th:text="${comment.id}"></td>
                    <td th:text="${comment.email}"></td>
                    <td th:text="${comment.body}"></td>
                    <td th:text="${comment.date}"></td>
                    <td>
                        <a class="btn btn-warning btn-sm" th:href="@{/comments/{id}/edit(id=${comment.id})}">
                            <i class="fa-solid fa-pen"></i>
                        </a>
                        <form class="d-inline" method="post"
                              th:action="@{/comments/{id}/delete(id=${comment.id})}">
                            <button class="btn btn-danger btn-sm" type="submit">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script crossorigin="anonymous" integrity="sha384-..."
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
